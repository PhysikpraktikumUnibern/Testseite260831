<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vorlesungsplanung</title>
  <style>
    :root{--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#d1d5db;--own:#eaf2ff;--own-border:#4f7fcf;--compare:#fff2df;--compare-border:#d88a1f;--accent:#1f5fae;--past:#f3f4f6}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
    header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(8px)}
    .wrap{width:min(1180px,calc(100% - 28px));margin:0 auto}.header-inner{display:flex;gap:18px;align-items:center;justify-content:space-between;padding:14px 0;flex-wrap:wrap}
    h1{margin:0;font-size:1.35rem}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.toggle{display:inline-flex;align-items:center;gap:8px;font-size:.95rem}
    main{padding:22px 0 60px}.status{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:18px}.status.error{border-color:#c2410c;background:#fff7ed}
    .past-controls{margin:14px 0 18px}.past-toggle{border:1px solid var(--border);background:#fff;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:600}#vergangenheit[hidden]{display:none}
    .date-group{margin-bottom:22px}.date-title{margin:0 0 8px;font-size:1rem;color:#374151}.date-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}.date-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
    .lecture-card{border:1px solid var(--border);border-left:6px solid var(--own-border);border-radius:12px;background:var(--card);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}.lecture-card.own{background:var(--own)}.lecture-card.compare{background:var(--compare);border-left-color:var(--compare-border)}.lecture-card.past{background:var(--past);opacity:.93}
    .lecture-head{padding:14px 16px 12px;border-bottom:1px solid rgba(0,0,0,.08)}.lecture-head-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.lecture-title{margin:0;font-size:1.08rem}.meta{margin-top:4px;color:var(--muted);font-size:.9rem}
    .badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:.78rem;font-weight:700;background:#e5e7eb}.badge.next{background:#dbeafe;color:#1e40af}.badge.compare{background:#fed7aa;color:#9a3412}.mail{display:inline-block;margin-top:10px;text-decoration:none;color:#0f4c8a;font-weight:600;font-size:.9rem}
    .lesson{border-top:1px solid rgba(0,0,0,.08)}.lesson:first-child{border-top:0}.lesson-title{padding:10px 16px;font-weight:700;background:rgba(255,255,255,.45)}details.experiment{border-top:1px solid rgba(0,0,0,.07);background:rgba(255,255,255,.6)}details.experiment summary{list-style:none;cursor:pointer;padding:11px 16px;display:flex;align-items:center;gap:10px;font-weight:600}details.experiment summary::-webkit-details-marker{display:none}details.experiment summary::before{content:"▸";transition:transform .15s ease;color:var(--muted)}details.experiment[open] summary::before{transform:rotate(90deg)}
    .experiment-body{padding:0 16px 14px 42px}.experiment-layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 180px;align-items:start}.experiment-text{white-space:pre-wrap}.thumb{width:180px;max-width:100%;border-radius:8px;border:1px solid var(--border);cursor:zoom-in;background:#fff;display:block}.empty{color:var(--muted);font-style:italic;padding:12px 16px}
    dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:96vh}dialog::backdrop{background:rgba(0,0,0,.82)}.lightbox{position:relative;display:flex;align-items:center;justify-content:center;max-width:96vw;max-height:96vh}.lightbox img{max-width:94vw;max-height:92vh;object-fit:contain;border-radius:6px;background:#fff}.close{position:absolute;right:8px;top:8px;border:0;background:rgba(0,0,0,.65);color:#fff;width:38px;height:38px;border-radius:999px;cursor:pointer;font-size:1.4rem;line-height:1}
    @media (max-width:780px){.date-grid.two{grid-template-columns:1fr}.experiment-layout{grid-template-columns:1fr}.experiment-body{padding-left:16px}.thumb{width:100%;max-width:420px}}
  </style>
</head>
<body>
<header><div class="wrap header-inner"><div><h1>Vorlesungsplanung</h1><div id="seriesLabel" class="meta"></div></div><div class="controls"><label class="toggle"><input type="checkbox" id="showCompare"> Vergleichsvorlesungen anzeigen</label></div></div></header>
<main class="wrap"><div id="status" class="status">Daten werden geladen …</div><div id="vergangenheit" hidden></div><div class="past-controls"><button id="pastToggle" class="past-toggle" type="button" hidden>Vergangene Vorlesungen anzeigen</button></div><div id="inhalt"></div></main>
<dialog id="lightboxDialog"><div class="lightbox"><button type="button" class="close" id="lightboxClose" aria-label="Schließen">×</button><img id="lightboxImage" alt=""></div></dialog>
<script>
(() => {
  const TEST_SERIE = null;
  const TEST_DATUM = null;
  const MAIL = "pi-demo.space@unibe.ch";
  const INDEX_URL = "index.json";
  const ALLOWED_SERIES = new Set([2,6,7,14]);
  const statusEl=document.getElementById("status"),contentEl=document.getElementById("inhalt"),pastEl=document.getElementById("vergangenheit"),pastToggle=document.getElementById("pastToggle"),showCompare=document.getElementById("showCompare"),seriesLabel=document.getElementById("seriesLabel");
  const lightboxDialog=document.getElementById("lightboxDialog"),lightboxImage=document.getElementById("lightboxImage"),lightboxClose=document.getElementById("lightboxClose");
  const lectureCache=new Map();
  function parseGermanDate(value){const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(value||"");return m?new Date(+m[3],+m[2]-1,+m[1]):null}
  function dayOnly(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())} function today(){return TEST_DATUM?dayOnly(TEST_DATUM):dayOnly(new Date())}
  function selectedSeries(){if(TEST_SERIE!==null)return Number(TEST_SERIE);const n=Number(new URLSearchParams(location.search).get("serie"));return ALLOWED_SERIES.has(n)?n:2}
  function safeText(v){return v==null?"":String(v)} function esc(v){return safeText(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
  async function loadLecture(path){if(!path)return null;if(lectureCache.has(path))return lectureCache.get(path);const p=fetch(path).then(r=>{if(!r.ok)throw new Error(`${path}: HTTP ${r.status}`);return r.json()});lectureCache.set(path,p);return p}
  function mailtoLecture(entry,data){return `mailto:${MAIL}?subject=${encodeURIComponent(`Frage zur Vorlesung ${safeText(data?.vorlesung||entry.vorlesungsnummer)} vom ${safeText(entry.datum)}`)}`}
  function mailtoExperiment(entry,exp){return `mailto:${MAIL}?subject=${encodeURIComponent(`Frage zum Versuch ${safeText(exp.versuch)} – Vorlesung ${safeText(entry.vorlesungsnummer)} vom ${safeText(entry.datum)}`)}`}
  function openLightbox(src,alt){lightboxImage.src=src;lightboxImage.alt=alt||"";lightboxDialog.showModal()} function closeLightbox(){lightboxDialog.close();lightboxImage.src=""}
  lightboxClose.addEventListener("click",closeLightbox);lightboxDialog.addEventListener("click",e=>{if(e.target===lightboxDialog)closeLightbox()});
  function experimentHtml(entry,exp,openDefault){const title=esc(exp.versuch||"Versuch"),text=esc(exp.text||""),thumb=exp.thumbnail||exp.bild||"",full=exp.bild||exp.thumbnail||"",hasImage=Number(exp.bild_vorhanden)===1&&thumb;return `<details class="experiment" ${openDefault?"open":""}><summary>${title}</summary><div class="experiment-body"><div class="experiment-layout"><div><div class="experiment-text">${text||'<span class="empty">Keine Beschreibung vorhanden.</span>'}</div><a class="mail" href="${mailtoExperiment(entry,exp)}">✉ Frage zum Versuch</a></div>${hasImage?`<img class="thumb" src="${esc(thumb)}" data-full="${esc(full)}" alt="${title}" loading="lazy" decoding="async">`:""}</div></div></details>`}
  function lectureHtml(entry,data,kind,isPast,isNext){const lessons=Array.isArray(data?.lektionen)?data.lektionen:[],lectureNo=data?.vorlesung||String(entry.vorlesungsnummer??"").padStart(2,"0"),label=kind==="compare"?"Vergleich":"Stammserie",badgeClass=kind==="compare"?"compare":(isNext?"next":"");const lessonsHtml=lessons.length?lessons.map(lesson=>{const exps=Array.isArray(lesson.versuche)?lesson.versuche:[];return `<section class="lesson"><div class="lesson-title">Lektion ${esc(lesson.lektion||lesson.lektion_nr||"")}</div>${exps.length?exps.map(exp=>experimentHtml(entry,exp,!isPast)).join(""):'<div class="empty">Keine Versuche vorhanden.</div>'}</section>`}).join(""):'<div class="empty">Keine Lektionen vorhanden.</div>';return `<article class="lecture-card ${kind} ${isPast?"past":""}"><div class="lecture-head"><div class="lecture-head-top"><div><h2 class="lecture-title">Vorlesung ${esc(lectureNo)}</h2><div class="meta">${esc(entry.datum)} · Serie ${esc(entry.stammserie)}</div></div><span class="badge ${badgeClass}">${isNext&&kind==="own"?"Nächste Vorlesung":label}</span></div><a class="mail" href="${mailtoLecture(entry,data)}">✉ Frage zur Vorlesung</a></div>${lessonsHtml}</article>`}
  async function renderDateGroup(dateKey,ownEntry,compareEntry,past,nextDateKey){const ownData=ownEntry?await loadLecture(ownEntry.datei):null,compareData=compareEntry?await loadLecture(compareEntry.datei):null;const ownHtml=ownEntry?lectureHtml(ownEntry,ownData,"own",past,dateKey===nextDateKey):"",compareHtml=compareEntry?lectureHtml(compareEntry,compareData,"compare",past,false):"";return `<section class="date-group"><h3 class="date-title">${esc(dateKey)}</h3><div class="date-grid ${ownHtml&&compareHtml?"two":""}">${ownHtml}${compareHtml}</div></section>`}
  function attachImageHandlers(root){root.querySelectorAll("img.thumb").forEach(img=>img.addEventListener("click",()=>openLightbox(img.dataset.full||img.src,img.alt)))}
  async function render(entries,serie){const own=entries.filter(e=>Number(e.stammserie)===serie).sort((a,b)=>parseGermanDate(a.datum)-parseGermanDate(b.datum));if(!own.length){statusEl.className="status error";statusEl.textContent=`Keine Vorlesungen für Serie ${serie} gefunden.`;return}const bySeriesAndDate=new Map();for(const e of entries)bySeriesAndDate.set(`${Number(e.stammserie)}|${e.datum}`,e);const now=today(),futureOwn=own.filter(e=>parseGermanDate(e.datum)>=now),nextDateKey=futureOwn.length?futureOwn[0].datum:null,pastGroups=[],currentFutureGroups=[];for(const ownEntry of own){const d=parseGermanDate(ownEntry.datum),isPast=d<now;let compareEntry=null;if(showCompare.checked&&ownEntry.vergleichsserie)compareEntry=bySeriesAndDate.get(`${Number(ownEntry.vergleichsserie)}|${ownEntry.datum}`)||null;const html=await renderDateGroup(ownEntry.datum,ownEntry,compareEntry,isPast,nextDateKey);(isPast?pastGroups:currentFutureGroups).push(html)}pastEl.innerHTML=pastGroups.join("");contentEl.innerHTML=currentFutureGroups.join("");pastToggle.hidden=pastGroups.length===0;if(!pastGroups.length)pastEl.hidden=true;attachImageHandlers(pastEl);attachImageHandlers(contentEl);statusEl.style.display="none"}
  async function start(){const serie=selectedSeries();seriesLabel.textContent=`Stammvorlesungsserie ${serie}`;try{const r=await fetch(`${INDEX_URL}?v=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw new Error(`index.json: HTTP ${r.status}`);const index=await r.json(),entries=Array.isArray(index.vorlesungen)?index.vorlesungen:[];await render(entries,serie);showCompare.addEventListener("change",async()=>{statusEl.style.display="";statusEl.className="status";statusEl.textContent="Ansicht wird aktualisiert …";await render(entries,serie)});pastToggle.addEventListener("click",()=>{const willShow=pastEl.hidden;pastEl.hidden=!willShow;pastToggle.textContent=willShow?"Vergangene Vorlesungen ausblenden":"Vergangene Vorlesungen anzeigen"})}catch(err){console.error(err);statusEl.className="status error";statusEl.textContent=`Fehler beim Laden der Vorlesungsdaten: ${err.message}`}}
  start();
})();
</script>
</body>
</html>
